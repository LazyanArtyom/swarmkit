name: Build and correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            preset: linux-debug
            sanitizer_flags: ""
          - name: Release
            build_type: Release
            preset: linux-release
            sanitizer_flags: ""
          - name: ASan-UBSan
            build_type: Debug
            preset: linux-asan
          - name: TSan
            build_type: Debug
            preset: linux-tsan

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: latest

      - name: Install Conan
        run: python3 -m pip install --upgrade "conan>=2.0,<3"

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Resolve dependencies
        run: >-
          conan install . -of build/conan
          -s build_type=${{ matrix.build_type }}
          -s compiler.cppstd=23
          -o '&:with_tools=True'
          -o '&:with_tests=True'
          --build=missing

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  protocol-lint:
    name: Protocol schema lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint canonical protobuf schema
        run: buf lint

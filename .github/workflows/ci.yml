name: Build and correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            preset: linux-debug
            sanitizer: none
          - name: Release
            build_type: Release
            preset: linux-release
            sanitizer: none
          - name: ASan-UBSan
            build_type: Debug
            preset: linux-asan
            sanitizer: asan-ubsan
          - name: TSan
            build_type: Debug
            preset: linux-tsan
            sanitizer: tsan

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Install Conan
        run: python3 -m pip install --upgrade "conan>=2.0,<3"

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Resolve dependencies
        shell: bash
        env:
          SWARMKIT_SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -o pipefail
          mkdir -p build
          sanitizer_args=()
          build_args=("--build=missing")
          case "${SWARMKIT_SANITIZER}" in
            asan-ubsan)
              # Abseil changes inline Cord behavior when ASan is enabled, so
              # every dependent binary must agree on ASan. Keep UBSan on the
              # SwarmKit targets: GCC cannot constexpr-evaluate parts of
              # Abseil when the dependency itself is UBSan-instrumented.
              compile_flags='["-fsanitize=address","-fno-omit-frame-pointer"]'
              link_flags='["-fsanitize=address"]'
              sanitizer_args+=(
                -c "tools.build:cflags=${compile_flags}"
                -c "tools.build:cxxflags=${compile_flags}"
                -c "tools.build:sharedlinkflags=${link_flags}"
                -c "tools.build:exelinkflags=${link_flags}"
              )
              build_args=(
                "--build=missing"
                "--build=abseil/*"
                "--build=protobuf/*"
                "--build=grpc/*"
              )
              ;;
            tsan)
              # The CMake preset instruments every SwarmKit target. Unlike
              # Abseil under ASan, the dependency graph has no TSan-dependent
              # inline ABI and does not need an expensive source rebuild.
              ;;
            none)
              ;;
            *)
              printf 'Unknown sanitizer mode: %s\n' "${SWARMKIT_SANITIZER}" >&2
              exit 2
              ;;
          esac

          conan install . -of build/conan \
            -s build_type=${{ matrix.build_type }} \
            -s compiler.cppstd=23 \
            -o '&:with_tools=True' \
            -o '&:with_tests=True' \
            "${sanitizer_args[@]}" \
            "${build_args[@]}" \
            2>&1 | tee "build/conan-resolve-${{ matrix.preset }}.log"

      - name: Publish dependency diagnostics
        if: failure()
        shell: bash
        run: >-
          bash scripts/ci_annotate_log.sh
          "build/conan-resolve-${{ matrix.preset }}.log"
          "Conan diagnostics (${{ matrix.preset }})"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: ${{ matrix.preset == 'linux-tsan' && 'report_signal_unsafe=0' || '' }}
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Publish CTest diagnostics
        if: failure()
        shell: bash
        run: >-
          bash scripts/ci_annotate_log.sh
          "build/${{ matrix.preset }}/Testing/Temporary/LastTest.log"
          "CTest diagnostics (${{ matrix.preset }})"

  macos-release:
    name: macOS ARM64 Release
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Conan
        run: pipx install "conan>=2.0,<3"

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Resolve dependencies
        run: >-
          conan install . -of build/conan
          -s build_type=Release
          -s compiler.cppstd=23
          -o '&:with_tools=True'
          -o '&:with_tests=True'
          --build=missing

      - name: Reclaim Conan build cache
        run: conan cache clean '*' --source --build --download --temp

      - name: Configure
        run: cmake --preset mac-release

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset mac-release --parallel 2 2>&1 | tee build/mac-release-build.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: >-
          bash scripts/ci_annotate_log.sh
          build/mac-release-build.log
          "macOS build diagnostics"

      - name: Test
        run: ctest --preset mac-release --output-on-failure

      - name: Publish CTest diagnostics
        if: failure()
        shell: bash
        run: >-
          bash scripts/ci_annotate_log.sh
          build/mac-release/Testing/Temporary/LastTest.log
          "CTest diagnostics (mac-release)"

  source-analysis:
    name: Project source analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install CMake, Ninja, and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build
          python3 -m pip install --upgrade "conan>=2.0,<3"

      - name: Configure dependencies
        run: |
          conan profile detect --force
          conan install . -of build/conan \
            -s build_type=Debug \
            -s compiler.cppstd=23 \
            -o '&:with_tools=True' \
            -o '&:with_tests=True' \
            --build=missing
          cmake --preset linux-debug

      - name: Run clang-tidy
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-clang-tidy.sh build/linux-debug 2>&1 | tee build/clang-tidy.log

      - name: Publish clang-tidy diagnostics
        if: failure()
        shell: bash
        run: >-
          bash scripts/ci_annotate_log.sh
          build/clang-tidy.log
          "clang-tidy diagnostics"

  conan-package:
    name: Conan package export
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Conan
        run: python3 -m pip install --upgrade "conan>=2.0,<3"

      - name: Build package from exported sources
        run: |
          conan profile detect --force
          conan create . \
            -s build_type=Release \
            -s compiler.cppstd=23 \
            -o '&:with_tools=False' \
            -o '&:with_tests=False' \
            --build=missing

      - name: Build relocatable SDK and tools archives
        run: >-
          ./scripts/ci_package.sh
          --preset linux-release
          --platform linux-x86_64

      - name: Compile and ping from the staged SDK
        run: |
          verify_root="$(mktemp -d)"
          tar -xzf dist/swarmkit-*-sdk-linux-x86_64.tar.gz -C "${verify_root}"
          tar -xzf dist/swarmkit-*-tools-linux-x86_64.tar.gz -C "${verify_root}"
          sdk_root="$(find "${verify_root}" -maxdepth 1 -type d -name 'swarmkit-*-sdk-linux-x86_64' -print -quit)"
          tools_root="$(find "${verify_root}" -maxdepth 1 -type d -name 'swarmkit-*-tools-linux-x86_64' -print -quit)"
          cmake -S apps/test_tools -B "${verify_root}/consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${sdk_root}"
          cmake --build "${verify_root}/consumer" --parallel 2
          "${tools_root}/bin/swarmkit-agent" \
            --insecure --id package-smoke --bind 127.0.0.1:50191 &
          agent_pid=$!
          trap 'kill "${agent_pid}" 2>/dev/null || true' EXIT
          sleep 1
          "${verify_root}/consumer/swarmkit-sdk-ping" \
            --addr 127.0.0.1:50191 --insecure
          kill "${agent_pid}"
          wait "${agent_pid}" || true
          trap - EXIT

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: swarmkit-linux-x86_64
          path: dist/*
          if-no-files-found: error

  protocol-lint:
    name: Protocol schema lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint canonical protobuf schema
        run: buf lint

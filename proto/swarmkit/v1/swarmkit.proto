/**
 * Top-level discriminated union mirroring the C++ Command variant.
 * Grouped by category to keep the oneof extensible.
 */
message Command {
    oneof kind {
        // Flight
        CmdArm arm = 1;
        CmdDisarm disarm = 2;
        CmdTakeoff takeoff = 3;
        CmdLand land = 4;
        CmdSetMode set_mode = 5;
        CmdForceDisarm force_disarm = 6;
        CmdFlightTerminate flight_terminate = 7;
        CmdForceArm force_arm = 8;

        // Navigation
        CmdSetWaypoint set_waypoint = 10;
        CmdReturnHome return_home = 11;
        CmdHoldPosition hold_position = 12;
        CmdSetSpeed set_speed = 13;
        CmdGoto goto_position = 14;
        CmdPause pause = 15;
        CmdResume resume = 16;
        CmdSetYaw set_yaw = 17;
        CmdVelocity velocity = 18;
        CmdSetHome set_home = 19;

        // Payload
        CmdPhoto photo = 50;
        CmdPhotoIntervalStart photo_interval_start = 51;
        CmdPhotoIntervalStop photo_interval_stop = 52;
        CmdVideoStart video_start = 53;
        CmdVideoStop video_stop = 54;
        CmdGimbalPoint gimbal_point = 55;
        CmdRoiLocation roi_location = 56;
        CmdRoiClear roi_clear = 57;
        CmdServo servo = 58;
        CmdRelay relay = 59;
        CmdGripper gripper = 60;

        // Backend-specific extension. Prefer typed core commands when possible.
        CmdBackendCommand backend_command = 80;
    }
}

message CommandRequest {
    CommandContext ctx = 1;
    Command cmd = 2;
}

enum BackendDispatchState {
    BACKEND_DISPATCH_STATE_UNSPECIFIED = 0;
    BACKEND_DISPATCH_ACCEPTED = 1;
    BACKEND_DISPATCH_REJECTED = 2;
    BACKEND_DISPATCH_FAILED = 3;
}

/// One protocol-level response observed while executing a backend command.
/// A response acknowledges protocol handling; it never proves physical arrival.
message BackendProtocolResponse {
    string protocol = 1;
    string command_name = 2;
    optional uint32 native_command_id = 3;
    bool response_expected = 4;
    bool response_received = 5;
    bool response_timed_out = 6;
    optional int32 result_code = 7;
    string result_name = 8;
    string status_text = 9;
}

/// Backend dispatch result with any protocol acknowledgements retained verbatim.
message BackendCommandOutcome {
    BackendDispatchState dispatch_state = 1;
    string message = 2;
    int64 dispatch_monotonic_time_ns = 3;
    int64 completion_monotonic_time_ns = 4;
    repeated BackendProtocolResponse protocol_responses = 5;
}

enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    ERROR_CODE_NONE = 1;
    ERROR_CODE_INVALID_ARGUMENT = 2;
    ERROR_CODE_REJECTED = 3;
    ERROR_CODE_PERMISSION_DENIED = 4;
    ERROR_CODE_NOT_FOUND = 5;
    ERROR_CODE_ALREADY_EXISTS = 6;
    ERROR_CODE_FAILED_PRECONDITION = 7;
    ERROR_CODE_UNSUPPORTED = 8;
    ERROR_CODE_UNAVAILABLE = 9;
    ERROR_CODE_DEADLINE_EXCEEDED = 10;
    ERROR_CODE_CANCELLED = 11;
    ERROR_CODE_BACKEND_FAILURE = 12;
    ERROR_CODE_INTERNAL = 13;
    ERROR_CODE_UNKNOWN = 14;
}

message CommandReply {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        OK = 1;
        REJECTED = 2;
        FAILED = 3;
    }
    Status status = 1;
    string message = 2;
    string correlation_id = 3;
    ErrorCode error_code = 4;
    string debug_message = 5;
    BackendCommandOutcome backend_outcome = 6;
}


// ---------------------------------------------------------------------------
// Authority arbitration
// ---------------------------------------------------------------------------

/**
 * Request to subscribe to authority change events for a drone.
 * Register before starting a command loop so that preemption events
 * are not missed.
 */
message WatchAuthorityRequest {
    string drone_id = 1;   /// Drone to watch.
    string client_id = 2;  /// Registrant's client identifier.
    int32 priority = 3;    /// Registrant's authority priority level.
}

/**
 * Delivered to watchers when authority over a drone changes.
 * Events are targeted to the watching client they affect.
 *
 * On PREEMPTED: stop sending commands until RESUMED arrives.
 * On RESUMED:   resume the command loop.
 * On EXPIRED:   your TTL elapsed; re-acquire by sending a new command.
 * On RELEASED:  your authority was explicitly relinquished.
 */
message AuthorityEvent {
    enum Kind {
        KIND_UNSPECIFIED = 0;
        GRANTED = 1;    /// This client was granted command authority.
        PREEMPTED = 2;  /// Authority taken by a higher-priority client.
        RESUMED = 3;    /// Higher-priority client released; authority restored.
        EXPIRED = 4;    /// Authority TTL elapsed; must re-acquire.
        RELEASED = 5;   /// Authority was explicitly relinquished.
    }
    Kind kind = 1;
    string drone_id = 2;
    string holder_client_id = 3;  /// Who now holds authority.
    int32 holder_priority = 4;
    string correlation_id = 5;
    string affected_client_id = 6;
}

/**
 * Request to acquire exclusive command authority for a drone.
 * Use priority equal to or higher than the current holder's to preempt.
 * ttl_ms = 0  →  no automatic expiry; caller must call ReleaseAuthority.
 * ttl_ms > 0  →  authority expires after ttl_ms milliseconds.
 */
message LockAuthorityRequest {
    CommandContext ctx = 1;  // drone_id, client_id, priority required.
    int64 ttl_ms = 2;        // 0 = no expiry.
}

message LockAuthorityReply {
    bool ok = 1;
    string message = 2;
    string correlation_id = 3;
    ErrorCode error_code = 4;
    string debug_message = 5;
}

message ReleaseAuthorityRequest {
    string drone_id = 1;
    string client_id = 2;
}

message ReleaseAuthorityReply {}

// ---------------------------------------------------------------------------
// Data plane: messages and artifacts
// ---------------------------------------------------------------------------

message DataMessage {
    string message_id = 1;
    uint64 sequence = 2;
    string source_id = 3;
    string target_id = 4;  // Empty means topic/broadcast delivery.
    string topic = 5;
    int64 unix_time_ms = 6;
    int64 ttl_ms = 7;
    map<string, string> labels = 8;
    bytes payload = 9;  // Small payload only; large data belongs in artifacts.
}

message PublishMessageRequest {
    DataMessage message = 1;
}

message PublishMessageReply {
    bool ok = 1;
    string message = 2;
    string correlation_id = 3;
    ErrorCode error_code = 4;
    string debug_message = 5;
    uint64 sequence = 6;
}

message MessageSubscription {
    string subscriber_id = 1;
    repeated string topics = 2;
    string target_id = 3;
    uint64 after_sequence = 4;
}

enum DataPeerState {
    DATA_PEER_STATE_UNKNOWN = 0;
    DATA_PEER_STATE_READY = 1;
    DATA_PEER_STATE_UNREACHABLE = 2;
    DATA_PEER_STATE_MISCONFIGURED = 3;
}

message DataPeerStatus {
    string drone_id = 1;
    string address = 2;
    string transport_security = 3;
    DataPeerState state = 4;
    int64 last_checked_unix_ms = 5;
    int64 last_success_unix_ms = 6;
    int64 last_failure_unix_ms = 7;
    int64 round_trip_ms = 8;
    string message = 9;
}

message DataPeerConfig {
    string drone_id = 1;
    string address = 2;
    string transport_security = 3;
    string root_ca_cert_path = 4;
    string cert_chain_path = 5;
    string private_key_path = 6;
    string server_authority_override = 7;
}

message DataPeerListRequest {
    bool refresh = 1;
}

message DataPeerRefreshRequest {
    repeated string drone_ids = 1;
}

message DataPeerRemoveRequest {
    string drone_id = 1;
}

message DataPeerListReply {
    repeated DataPeerStatus peers = 1;
    string correlation_id = 2;
    bool ok = 3;
    string message = 4;
    ErrorCode error_code = 5;
}

message ArtifactDescriptor {
    string artifact_id = 1;
    string source_id = 2;
    string target_id = 3;
    string content_type = 4;
    string filename = 5;
    int64 size_bytes = 6;
    int64 created_unix_ms = 7;
    int64 ttl_ms = 8;
    string sha256_hex = 9;
    map<string, string> labels = 10;
}

message ArtifactChunk {
    string transfer_id = 1;
    ArtifactDescriptor artifact = 2;  // Required on the first chunk.
    int64 offset = 3;
    int32 chunk_index = 4;
    bytes data = 5;
    bool final_chunk = 6;
}

message CreateArtifactUploadRequest {
    ArtifactDescriptor artifact = 1;
    int64 ttl_ms = 2;
}

message ArtifactUploadRequest {
    string upload_id = 1;
}

message ArtifactUploadSession {
    string upload_id = 1;
    ArtifactDescriptor artifact = 2;
    int64 bytes_received = 3;
    int32 next_chunk_index = 4;
    int64 created_unix_ms = 5;
    int64 updated_unix_ms = 6;
    int64 expires_unix_ms = 7;
    bool committed = 8;
}

message ArtifactUploadReply {
    bool ok = 1;
    string message = 2;
    string correlation_id = 3;
    ErrorCode error_code = 4;
    string debug_message = 5;
    ArtifactUploadSession upload = 6;
    ArtifactDescriptor artifact = 7;
}

message ArtifactRequest {
    string artifact_id = 1;
    int64 offset_bytes = 2;
}

message ArtifactListRequest {
    string source_id = 1;
    string target_id = 2;
    bool include_expired = 3;
    int32 page_size = 4;
    string page_token = 5;
}

message ArtifactListReply {
    repeated ArtifactDescriptor artifacts = 1;
    string correlation_id = 2;
    string next_page_token = 3;
    int32 total_count = 4;
}

message ArtifactReply {
    bool ok = 1;
    string message = 2;
    string correlation_id = 3;
    ErrorCode error_code = 4;
    string debug_message = 5;
    ArtifactDescriptor artifact = 6;
}

enum ArtifactTransferState {
    ARTIFACT_TRANSFER_STATE_UNKNOWN = 0;
    ARTIFACT_TRANSFER_STATE_QUEUED = 1;
    ARTIFACT_TRANSFER_STATE_RUNNING = 2;
    ARTIFACT_TRANSFER_STATE_COMPLETED = 3;
    ARTIFACT_TRANSFER_STATE_FAILED = 4;
    ARTIFACT_TRANSFER_STATE_CANCELLED = 5;
}

message ArtifactTransferStartRequest {
    string source_path = 1;
    ArtifactDescriptor artifact = 2;
    bool route_to_target = 3;
    int32 chunk_bytes = 4;
}

message ArtifactTransferStatus {
    string transfer_id = 1;
    ArtifactTransferState state = 2;
    ArtifactDescriptor artifact = 3;
    int64 bytes_total = 4;
    int64 bytes_transferred = 5;
    int64 started_unix_ms = 6;
    int64 updated_unix_ms = 7;
    int64 completed_unix_ms = 8;
    string message = 9;
    ErrorCode error_code = 10;
}

message ArtifactTransferRequest {
    string transfer_id = 1;
}

message ArtifactTransferReply {
    bool ok = 1;
    string message = 2;
    string correlation_id = 3;
    ErrorCode error_code = 4;
    string debug_message = 5;
    ArtifactTransferStatus transfer = 6;
}

// ---------------------------------------------------------------------------
// Telemetry
// ---------------------------------------------------------------------------

message TelemetryRequest {
    string drone_id = 1;
    int32 rate_hz = 2;  /// 0 => server default.
    uint64 after_sequence = 3;  /// Replay normalized frames with sequence > this cursor.
    string expected_agent_session_id = 4;  /// Empty only for the first connection.
}

enum TelemetryStreamEventKind {
    TELEMETRY_STREAM_EVENT_UNSPECIFIED = 0;
    TELEMETRY_STREAM_STARTED = 1;
    TELEMETRY_REPLAY_STARTED = 2;
    TELEMETRY_REPLAY_COMPLETED = 3;
    TELEMETRY_LIVE_BOUNDARY = 4;
    TELEMETRY_HISTORY_EVICTED = 5;
    TELEMETRY_SESSION_MISMATCH = 6;
    TELEMETRY_CURSOR_AHEAD = 7;
}

/// Control-plane evidence carried in-band with replayed and live telemetry.
message TelemetryStreamEvent {
    TelemetryStreamEventKind kind = 1;
    string drone_id = 2;
    string agent_session_id = 3;
    string transport_stream_id = 4;
    string expected_agent_session_id = 5;
    uint64 requested_after_sequence = 6;
    uint64 oldest_available_sequence = 7;
    uint64 latest_available_sequence = 8;
    uint64 replay_first_sequence = 9;
    uint64 replay_last_sequence = 10;
    uint64 live_from_sequence = 11;
    string detail = 12;
}

message TelemetryStreamItem {
    oneof item {
        TelemetryStreamEvent event = 1;
        TelemetryFrame frame = 2;
    }
}

enum TelemetryCoordinateFrame {
    TELEMETRY_COORDINATE_FRAME_UNSPECIFIED = 0;
    TELEMETRY_COORDINATE_FRAME_WGS84 = 1;
    TELEMETRY_COORDINATE_FRAME_LOCAL_NED = 2;
    TELEMETRY_COORDINATE_FRAME_BODY_NED = 3;
}

enum TelemetryGpsQuality {
    TELEMETRY_GPS_QUALITY_UNSPECIFIED = 0;
    TELEMETRY_GPS_QUALITY_NO_FIX = 1;
    TELEMETRY_GPS_QUALITY_2D_FIX = 2;
    TELEMETRY_GPS_QUALITY_3D_FIX = 3;
    TELEMETRY_GPS_QUALITY_DGPS = 4;
    TELEMETRY_GPS_QUALITY_RTK_FLOAT = 5;
    TELEMETRY_GPS_QUALITY_RTK_FIXED = 6;
    TELEMETRY_GPS_QUALITY_STATIC = 7;
    TELEMETRY_GPS_QUALITY_PPP = 8;
}

enum TelemetryEstimatorState {
    TELEMETRY_ESTIMATOR_STATE_UNSPECIFIED = 0;
    TELEMETRY_ESTIMATOR_STATE_INITIALIZING = 1;
    TELEMETRY_ESTIMATOR_STATE_HEALTHY = 2;
    TELEMETRY_ESTIMATOR_STATE_DEGRADED = 3;
    TELEMETRY_ESTIMATOR_STATE_FAULT = 4;
}

enum TelemetryClockDomain {
    TELEMETRY_CLOCK_DOMAIN_UNKNOWN = 0;
    TELEMETRY_CLOCK_DOMAIN_UNIX_EPOCH = 1;
    TELEMETRY_CLOCK_DOMAIN_VEHICLE_BOOT = 2;
    TELEMETRY_CLOCK_DOMAIN_AGENT_MONOTONIC = 3;
    TELEMETRY_CLOCK_DOMAIN_SDK_MONOTONIC = 4;
}

enum TelemetryClockSynchronization {
    TELEMETRY_CLOCK_SYNCHRONIZATION_UNKNOWN = 0;
    TELEMETRY_CLOCK_UNSYNCHRONIZED = 1;
    TELEMETRY_CLOCK_ESTIMATED = 2;
    TELEMETRY_CLOCK_SYNCHRONIZED = 3;
}

message TelemetryTimestampEvidence {
    optional int64 timestamp_ms = 1;
    TelemetryClockDomain clock_domain = 2;
    TelemetryClockSynchronization synchronization = 3;
    optional double clock_uncertainty_ms = 4;
}

message TelemetryMeasurementProvenance {
    bool updated = 1;
    uint64 generation = 2;
    TelemetryTimestampEvidence source_time = 3;
    optional int64 agent_receive_unix_time_ms = 4;
    optional int64 agent_receive_monotonic_time_ns = 5;
    string source = 6;
}

message TelemetryProvenance {
    TelemetryMeasurementProvenance position = 1;
    TelemetryMeasurementProvenance velocity = 2;
    TelemetryMeasurementProvenance accuracy = 3;
    TelemetryMeasurementProvenance estimator = 4;
    TelemetryMeasurementProvenance vehicle_state = 5;
}

message TelemetryValidityFlags {
    bool position = 1;
    bool relative_altitude = 2;
    bool absolute_altitude = 3;
    bool velocity = 4;
    bool attitude = 5;
    bool battery = 6;
    bool mode = 7;
    bool armed = 8;
    bool landed = 9;
    bool failsafe = 10;
    bool gps = 11;
    bool gps_hdop = 12;
    bool link_quality = 13;
    bool estimator = 14;
    bool home_origin = 15;
}

enum TelemetryUncertaintySemantics {
    TELEMETRY_UNCERTAINTY_UNKNOWN = 0;
    TELEMETRY_UNCERTAINTY_STANDARD_DEVIATION = 1;
    TELEMETRY_UNCERTAINTY_CONFIDENCE_BOUND = 2;
    TELEMETRY_UNCERTAINTY_EMPIRICALLY_CALIBRATED_BOUND = 3;
    TELEMETRY_UNCERTAINTY_DETERMINISTIC_HARD_BOUND = 4;
    TELEMETRY_UNCERTAINTY_BACKEND_SPECIFIC = 5;
}

message TelemetryUncertaintyDescriptor {
    TelemetryUncertaintySemantics semantics = 1;
    optional double confidence_level = 2;
    string calibration_profile_id = 3;
    string calibration_version = 4;
    string source = 5;
    uint64 measurement_generation = 6;
}

message TelemetryUncertaintyEstimate {
    float value = 1;
    TelemetryUncertaintyDescriptor uncertainty = 2;
}

message TelemetryCovariance3x3 {
    repeated float values = 1;
}

message TelemetryAccuracy {
    TelemetryUncertaintyEstimate horizontal_position = 1;
    TelemetryUncertaintyEstimate vertical_position = 2;
    TelemetryUncertaintyEstimate horizontal_velocity = 3;
    TelemetryUncertaintyEstimate vertical_velocity = 4;
    TelemetryUncertaintyEstimate speed = 5;
    optional float heading_deg = 6;
    optional float attitude_deg = 7;
    TelemetryCovariance3x3 position_covariance = 8;
    TelemetryCovariance3x3 velocity_covariance = 9;
}

message TelemetryHomeOrigin {
    TelemetryCoordinateFrame frame = 1;
    double lat_deg = 2;
    double lon_deg = 3;
    float alt_m = 4;
    float north_m = 5;
    float east_m = 6;
    float down_m = 7;
}

message TelemetryFrame {
    string drone_id = 1;
    string agent_session_id = 2;
    uint64 telemetry_sequence = 3;
    int64 agent_receive_unix_time_ms = 4;
    int64 agent_receive_monotonic_time_ns = 5;
    string transport_stream_id = 6;
    double lat_deg = 7;
    double lon_deg = 8;
    float rel_alt_m = 9;
    float abs_alt_m = 10;
    float vx_mps = 11;
    float vy_mps = 12;
    float vz_mps = 13;
    float roll_deg = 14;
    float pitch_deg = 15;
    float yaw_deg = 16;
    float battery_percent = 17;
    string mode = 18;
    bool armed = 19;
    bool landed = 20;
    bool failsafe = 21;
    int32 gps_fix_type = 22;
    int32 satellites_visible = 23;
    float gps_hdop = 24;
    float link_quality_percent = 25;
    TelemetryCoordinateFrame position_frame = 26;
    TelemetryCoordinateFrame velocity_frame = 27;
    TelemetryValidityFlags validity = 28;
    TelemetryAccuracy accuracy = 29;
    TelemetryHomeOrigin home_origin = 30;
    TelemetryGpsQuality gps_quality = 31;
    TelemetryEstimatorState estimator_state = 32;
    uint32 estimator_flags = 33;
    bool estimator_position_ok = 34;
    bool estimator_velocity_ok = 35;
    bool estimator_attitude_ok = 36;
    ExecutionHandle execution_handle = 37;
    TelemetryProvenance provenance = 38;
}

// ---------------------------------------------------------------------------
// Deterministic execution evidence log
// ---------------------------------------------------------------------------

enum ExecutionSessionState {
    EXECUTION_SESSION_STATE_UNSPECIFIED = 0;
    EXECUTION_SESSION_STARTED = 1;
    EXECUTION_SESSION_COMPLETED = 2;
    EXECUTION_SESSION_INVALIDATED = 3;
}

message ExecutionRunMetadata {
    string run_id = 1;
    string scenario_id = 2;
    optional uint64 random_seed = 3;
    string configuration_sha256 = 4;
    string software_version = 5;
    string backend_name = 6;
    string backend_protocol = 7;
    string calibration_profile_id = 8;
    string calibration_version = 9;
    map<string, string> labels = 10;
}

message ExecutionSessionEvent {
    ExecutionSessionState state = 1;
    ExecutionRunMetadata metadata = 2;
    string detail = 3;
}

enum CommandExecutionStage {
    COMMAND_EXECUTION_STAGE_UNSPECIFIED = 0;
    COMMAND_EXECUTION_REQUESTED = 1;
    COMMAND_EXECUTION_COMPLETED = 2;
}

message CommandExecutionEvent {
    CommandExecutionStage stage = 1;
    CommandRequest request = 2;
    BackendCommandOutcome outcome = 3;
    ExecutionHandle execution_handle = 4;
}

message GoalLifecycleEvent {
    GoalStatus status = 1;
    ActiveGoal goal = 2;
    ExecutionHandle execution_handle = 3;
    string detail = 4;
}

message VehicleHealthEvent {
    string drone_id = 1;
    TelemetryValidityFlags validity = 2;
    TelemetryEstimatorState estimator_state = 3;
    bool estimator_position_ok = 4;
    bool estimator_velocity_ok = 5;
    bool failsafe = 6;
    bool armed = 7;
    bool landed = 8;
}

/// Algorithm-neutral diagnostic/evidence emitted by a backend or decorator.
/// This message is not normalized vehicle telemetry and never carries
/// simulation truth.
message BackendEvidenceEvent {
    string source = 1;
    string kind = 2;
    uint64 source_sequence = 3;
    optional uint64 random_seed = 4;
    map<string, string> attributes = 5;
}

/// Versioned envelope used as the payload of every framed evidence-log record.
message ExecutionEventEnvelope {
    uint32 schema_version = 1;
    uint64 event_sequence = 2;
    string agent_session_id = 3;
    int64 agent_unix_time_ms = 4;
    int64 agent_monotonic_time_ns = 5;
    ExecutionRunMetadata run_metadata = 6;
    oneof event {
        ExecutionSessionEvent session = 10;
        TelemetryFrame telemetry = 11;
        CommandExecutionEvent command = 12;
        GoalLifecycleEvent goal = 13;
        AgentReport report = 14;
        VehicleHealthEvent health = 15;
        AuthorityEvent authority = 16;
        BackendEvidenceEvent backend = 17;
    }
}

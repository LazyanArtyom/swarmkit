syntax = "proto3";

package swarmkit.v1;

/**
 * A single per-vehicle agent running on the edge (e.g. Raspberry Pi).
 * - Accepts commands subject to priority-based authority arbitration.
 * - Publishes telemetry.
 */
service AgentService {
    rpc Ping(PingRequest) returns (PingReply);
    rpc GetHealth(HealthRequest) returns (HealthReply);
    rpc GetRuntimeStats(RuntimeStatsRequest) returns (RuntimeStatsReply);
    rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesReply);

    /// Send one flight command to the agent.
    /// The agent routes the command through the CommandArbiter before
    /// forwarding it to the configured backend.
    rpc SendCommand(CommandRequest) returns (CommandReply);

    /// Subscribe to a server-streaming telemetry feed.
    rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetryFrame);

    /// Set or replace the active supervised goal for one drone.
    /// The agent sends the corresponding guided movement command, then reports
    /// active/reached/deviating/failed status through SubscribeReports().
    rpc SetActiveGoal(SetActiveGoalRequest) returns (SetActiveGoalReply);

    /// Cancel the active supervised goal for one drone.
    rpc CancelGoal(CancelGoalRequest) returns (CancelGoalReply);

    /// Read the currently active supervised goal for one drone.
    rpc GetActiveGoal(GetActiveGoalRequest) returns (GetActiveGoalReply);

    /// Subscribe to typed agent reports: goal state, command state, health, and
    /// authority events. Reports are intentionally policy-neutral so user
    /// controllers can decide their own correction behavior.
    rpc SubscribeReports(ReportSubscription) returns (stream AgentReport);

    /// Subscribe to command-authority change events for a drone.
    /// The stream delivers AuthorityEvent messages whenever a client acquires,
    /// preempts, or releases command authority.  Use this to implement
    /// pause/resume logic in clients with periodic command loops.
    rpc WatchAuthority(WatchAuthorityRequest) returns (stream AuthorityEvent);

    /// Acquire exclusive command authority for a drone.
    /// A lower-priority client is rejected immediately.
    /// ttl_ms=0 means no expiry — caller MUST call ReleaseAuthority() when done.
    rpc LockAuthority(LockAuthorityRequest) returns (LockAuthorityReply);

    /// Explicitly release command authority held by this client.
    /// No-op if the client does not currently hold authority.
    rpc ReleaseAuthority(ReleaseAuthorityRequest) returns (ReleaseAuthorityReply);
}

/**
 * Independent data plane for app messages and binary artifacts.
 * This service intentionally does not participate in command authority locks.
 */
service DataService {
    rpc PublishMessage(PublishMessageRequest) returns (PublishMessageReply);
    rpc SendMessageToDrone(PublishMessageRequest) returns (PublishMessageReply);
    rpc SubscribeMessages(MessageSubscription) returns (stream DataMessage);
    rpc ListDataPeers(DataPeerListRequest) returns (DataPeerListReply);
    rpc RefreshDataPeers(DataPeerRefreshRequest) returns (DataPeerListReply);
    rpc UpsertDataPeer(DataPeerConfig) returns (DataPeerListReply);
    rpc RemoveDataPeer(DataPeerRemoveRequest) returns (DataPeerListReply);
    rpc UploadArtifact(stream ArtifactChunk) returns (ArtifactDescriptor);
    rpc SendArtifactToDrone(stream ArtifactChunk) returns (ArtifactDescriptor);
    rpc StartArtifactTransfer(ArtifactTransferStartRequest) returns (ArtifactTransferReply);
    rpc GetArtifactTransfer(ArtifactTransferRequest) returns (ArtifactTransferReply);
    rpc CancelArtifactTransfer(ArtifactTransferRequest) returns (ArtifactTransferReply);
    rpc ListArtifacts(ArtifactListRequest) returns (ArtifactListReply);
    rpc GetArtifact(ArtifactRequest) returns (ArtifactReply);
    rpc DownloadArtifact(ArtifactRequest) returns (stream ArtifactChunk);
    rpc AnnounceArtifact(ArtifactDescriptor) returns (ArtifactReply);
}


    float max_climb_speed_mps = 22;
    float max_descent_speed_mps = 23;
    float max_altitude_m = 24;
    repeated string supported_payload_action_namespaces = 25;
    repeated string supported_payload_action_names = 26;
    int32 payload_timing_precision_ms = 27;
    bool supports_payload_scheduling = 28;
}

// ---------------------------------------------------------------------------
// Commands
// ---------------------------------------------------------------------------

/**
 * Standard priority levels for command arbitration.
 * Values mirror swarmkit::agent::CommandPriority in commands.h.
 */
enum CommandPriority {
    PRIORITY_OPERATOR = 0;     // Default: CLI and SDK clients.
    PRIORITY_SUPERVISOR = 10;  // Automated local systems.
    PRIORITY_OVERRIDE = 20;    // Deviation-correction / safety override server.
    PRIORITY_EMERGENCY = 100;  // Bypasses arbitration; always executes.
}

/**
 * Metadata that travels with every command.
 * The agent's CommandArbiter uses client_id and priority to decide
 * whether the command is allowed to execute.
 */
message CommandContext {
    string drone_id = 1;         /// Target drone identifier.
    int32 priority = 2;          /// CommandPriority value (default: PRIORITY_OPERATOR).
    int64 deadline_unix_ms = 3;  /// Execution deadline; 0 = no deadline.
    string correlation_id = 4;   /// Caller-assigned tracing ID.
    string client_id = 5;        /// Originating client identifier (required for arbitration).
}

// --- Flight commands (fundamental vehicle control) ---

message CmdArm {}
message CmdDisarm {}
message CmdLand {}

message CmdTakeoff {
    double alt_m = 1;  /// Target altitude in metres AGL.
}

message CmdSetMode {
    string mode = 1;
    int32 custom_mode = 2;  /// -1 means use mode.
}

message CmdForceDisarm {}
message CmdFlightTerminate {}

// --- Navigation commands (point-to-point movement) ---

message CmdSetWaypoint {
    double lat_deg = 1;   /// Target latitude in decimal degrees.
    double lon_deg = 2;   /// Target longitude in decimal degrees.
    double alt_m = 3;     /// Target altitude in metres AGL.
    float speed_mps = 4;  /// Max travel speed in m/s; 0 = backend default.
}

message CmdReturnHome {}
message CmdHoldPosition {}

message CmdSetSpeed {
    float ground_mps = 1;
}

message CmdGoto {
    double lat_deg = 1;
    double lon_deg = 2;
    double alt_m = 3;
    float speed_mps = 4;
    float yaw_deg = 5;
    bool use_yaw = 6;
}

message CmdPause {}
message CmdResume {}

message CmdSetYaw {
    float yaw_deg = 1;
    float rate_deg_s = 2;
    bool relative = 3;
}

message CmdVelocity {
    float vx_mps = 1;
    float vy_mps = 2;
    float vz_mps = 3;
    int32 duration_ms = 4;
    bool body_frame = 5;
}

message CmdSetHome {
    bool use_current = 1;
    double lat_deg = 2;
    double lon_deg = 3;
    double alt_m = 4;
}

// --- Mission commands ---

enum MissionItemType {
    MISSION_ITEM_WAYPOINT = 0;
    MISSION_ITEM_TAKEOFF = 1;
    MISSION_ITEM_LAND = 2;
    MISSION_ITEM_LOITER = 3;
    MISSION_ITEM_DELAY = 4;
    MISSION_ITEM_ACTION = 5;
    MISSION_ITEM_PAYLOAD_ACTION = 6;
}

message MissionItem {
    uint32 command = 1;  // Deprecated backend-native command id.
    double lat_deg = 2;
    double lon_deg = 3;
    double alt_m = 4;
    float param1 = 5;
    float param2 = 6;
    float param3 = 7;
    float param4 = 8;
    bool current = 9;
    bool autocontinue = 10;
    MissionItemType type = 11;
    float hold_s = 12;
    float acceptance_radius_m = 13;
    float yaw_deg = 14;
    string action_namespace = 15;
    string action_name = 16;
    map<string, string> params = 17;
}

message CmdUploadMission {
    repeated MissionItem items = 1;
}

message CmdClearMission {}

message CmdStartMission {
    int32 first_item = 1;
    int32 last_item = 2;
}

message CmdPauseMission {}
message CmdResumeMission {}

message CmdSetCurrentMissionItem {
    int32 seq = 1;
}

// --- Swarm commands (multi-agent coordination) ---

message CmdSetRole {
    string role = 1;  /// Freeform role label (e.g. "leader", "follower-3").
}

message CmdSetFormation {
    string formation_id = 1;  /// Identifier of the formation template.
    int32 slot_index = 2;     /// Zero-based position within the formation.
}

// --- Payload commands ---

message CmdPhoto {
    int32 camera_id = 1;
}

message CmdPhotoIntervalStart {
    float interval_s = 1;

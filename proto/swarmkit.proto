// Ping
// ---------------------------------------------------------------------------

message PingRequest {
    string agent_id = 1;
}

message PingReply {
    string agent_id = 1;
    string version = 2;
    int64 unix_time_ms = 3;
    string correlation_id = 4;
}

message HealthRequest {}

message HealthReply {
    bool ok = 1;
    bool ready = 2;
    string agent_id = 3;
    string version = 4;
    int64 unix_time_ms = 5;
    string message = 6;
    string correlation_id = 7;
    string backend_name = 8;
    string protocol = 9;
    int64 last_heartbeat_unix_ms = 10;
    int64 last_telemetry_unix_ms = 11;
    bool armed = 12;
    bool landed = 13;
    bool failsafe = 14;
    bool gps_ok = 15;
    bool ekf_ok = 16;
    float link_quality_percent = 17;
}

message RuntimeStatsRequest {}

message RuntimeStatsReply {
    string agent_id = 1;
    int64 unix_time_ms = 2;
    string correlation_id = 3;
    uint64 ping_requests_total = 4;
    uint64 health_requests_total = 5;
    uint64 runtime_stats_requests_total = 6;
    uint64 command_requests_total = 7;
    uint64 command_rejected_total = 8;
    uint64 command_failed_total = 9;
    uint64 lock_requests_total = 10;
    uint64 watch_requests_total = 11;
    uint64 current_authority_watchers = 12;
    uint64 total_telemetry_subscriptions = 13;
    uint64 current_telemetry_streams = 14;
    uint64 telemetry_frames_sent_total = 15;
    uint64 backend_failures_total = 16;
    bool ready = 17;
}

message CapabilitiesRequest {}

message CapabilitiesReply {
    string agent_id = 1;
    int64 unix_time_ms = 2;
    string correlation_id = 3;
    bool supports_mission_upload = 4;
    bool supports_payload_control = 5;
    bool supports_velocity_control = 6;
    bool supports_flight_termination = 7;
    string autopilot_type = 8;
    repeated string supported_modes = 9;
    string backend_name = 10;
    string protocol = 11;
    string vehicle_class = 12;
    bool supports_backend_commands = 13;
    bool supports_time_sync = 14;
    bool supports_trajectory_upload = 15;
    repeated string supported_commands = 16;
    repeated string supported_mission_items = 17;
    repeated string supported_payloads = 18;
    repeated string supported_telemetry_fields = 19;
    repeated string backend_command_names = 20;

}

message CmdReturnHome {}
message CmdHoldPosition {}

message CmdSetSpeed {
    float ground_mps = 1;
}

message CmdGoto {
    double lat_deg = 1;
    double lon_deg = 2;
    double alt_m = 3;
    float speed_mps = 4;
    float yaw_deg = 5;
    bool use_yaw = 6;
}

message CmdPause {}
message CmdResume {}

message CmdSetYaw {
    float yaw_deg = 1;

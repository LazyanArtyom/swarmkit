agent:
  agent_id: "pixhawk-drone-1"
  bind_addr: "0.0.0.0:50061"
  backend: "mavlink"
  default_authority_ttl_ms: 5000
  default_telemetry_rate_hz: 10
  min_telemetry_rate_hz: 2
  report_log_file: "/var/log/swarmkit/agent-reports.jsonl"
  vehicle_profile:
    profile_id: "pixhawk-companion-quad"
    cruise_speed_mps: 4.0
    climb_speed_mps: 1.5
    descent_speed_mps: 1.0
    max_altitude_m: 120.0
    min_battery_percent: 25.0
    battery_reserve_percent: 15.0
    tracking_tolerance_m: 2.0
    goal_margin_ms: 20000
    takeoff_timeout_margin_ms: 25000
    land_timeout_margin_ms: 40000
    max_goal_timeout_ms: 300000
    min_gps_fix_type: 3
    min_satellites_visible: 8
    max_gps_hdop: 2.0
  mavlink:
    drone_id: "drone-1"
    bind_addr: "0.0.0.0:14601"
    autopilot_profile: "ardupilot-copter"
    target_system: 1
    target_component: 1
    source_system: 245
    source_component: 191
    telemetry_rate_hz: 10
    peer_discovery_timeout_ms: 5000
    command_ack_timeout_ms: 3000
    set_guided_before_arm: true
    set_guided_before_takeoff: true
    guided_mode: 4
    allow_flight_termination: false
  security:
    transport_security: "mtls"
    root_ca_cert_path: "/etc/swarmkit/certs/ca.pem"
    cert_chain_path: "/etc/swarmkit/certs/agent.pem"
    private_key_path: "/etc/swarmkit/certs/agent.key"
    allowed_client_ids:
      - "swarmkit-cli"
      - "swarm-supervisor"

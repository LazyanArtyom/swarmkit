<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="dt dd"><title id="dt">Revised VECR state model</title><desc id="dd">Proposed public phases and terminal callback contract.</desc><rect width="900" height="350" fill="#f7faf8" rx="14"/><g font-family="Arial, sans-serif"><rect x="20" y="48" width="250" height="79" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="145.0" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">MOVING</text><text x="145.0" y="99" text-anchor="middle" font-size="13" fill="#4f6961">Collect evidence</text><rect x="325" y="48" width="250" height="79" rx="13" fill="#fff0dc" stroke="#82a69a"/><text x="450.0" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">DEVIATING</text><text x="450.0" y="99" text-anchor="middle" font-size="13" fill="#4f6961">Qualified departure</text><rect x="630" y="48" width="250" height="79" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="755.0" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">RECOVERING</text><text x="755.0" y="99" text-anchor="middle" font-size="13" fill="#4f6961">Re-enter before B</text><path d="M270 88H323 M575 88H627" stroke="#4d8574" stroke-width="3"/><rect x="20" y="190" width="250" height="85" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="145.0" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">ARRIVED</text><text x="145.0" y="241" text-anchor="middle" font-size="13" fill="#4f6961">Coverage: verified / incomplete</text><rect x="325" y="190" width="250" height="85" rx="13" fill="#fff0dc" stroke="#82a69a"/><text x="450.0" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">FAILED / UNKNOWN</text><text x="450.0" y="241" text-anchor="middle" font-size="13" fill="#4f6961">Safety, refusal, budget</text><rect x="630" y="190" width="250" height="85" rx="13" fill="#eff0ff" stroke="#82a69a"/><text x="755.0" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">CANCELLED</text><text x="755.0" y="241" text-anchor="middle" font-size="13" fill="#4f6961">Explicit terminal cancel</text><text x="450" y="334" text-anchor="middle" font-size="14" fill="#254e43">One terminal result / attempt · status pull at any time · no endpoint-repair loop</text></g></svg>
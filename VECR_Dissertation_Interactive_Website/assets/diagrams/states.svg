<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 355" role="img" aria-labelledby="title desc"><title id="title">Canonical execution phases</title><desc id="desc">Simplified state diagram; transition guards are described in the manuscript.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#57716d" stroke-width="1.4"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eeea" stroke-width=".6"/></pattern></defs><rect width="880" height="355" rx="16" fill="#f8faf7"/><rect width="880" height="355" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#183c36"><rect x="30" y="30" width="220" height="74" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="140.0" y="61" text-anchor="middle" font-size="17" font-weight="600">MOVING</text><text x="140.0" y="85" text-anchor="middle" font-size="13" fill="#4c6660">Consume navigation + captures</text><path d="M250 67 L330 67" fill="none" stroke="#57716d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="332" y="30" width="220" height="74" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="442.0" y="61" text-anchor="middle" font-size="17" font-weight="600">DEVIATING</text><text x="442.0" y="85" text-anchor="middle" font-size="13" fill="#4c6660">Conformance trigger accumulates</text><path d="M552 67 L630 67" fill="none" stroke="#57716d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="30" width="220" height="74" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="742.0" y="61" text-anchor="middle" font-size="17" font-weight="600">RECOVERING</text><text x="742.0" y="85" text-anchor="middle" font-size="13" fill="#4c6660">Command ACK ≠ physical return</text><path d="M742 104V154H140V105" stroke="#57716d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><text x="440" y="143" text-anchor="middle" font-size="13">Bounded re-entry dwell + accepted continuation → MOVING</text><rect x="30" y="210" width="220" height="74" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="140.0" y="241" text-anchor="middle" font-size="17" font-weight="600">FULFILLED</text><text x="140.0" y="265" text-anchor="middle" font-size="13" fill="#4c6660">Requested predicates satisfied</text><rect x="332" y="210" width="220" height="74" rx="12" fill="#fff1dd" stroke="#afc7bc"/><text x="442.0" y="241" text-anchor="middle" font-size="17" font-weight="600">UNKNOWN</text><text x="442.0" y="265" text-anchor="middle" font-size="13" fill="#4c6660">Usable evidence unavailable</text><rect x="632" y="210" width="220" height="74" rx="12" fill="#f8e6df" stroke="#afc7bc"/><text x="742.0" y="241" text-anchor="middle" font-size="17" font-weight="600">INTERRUPTED</text><text x="742.0" y="265" text-anchor="middle" font-size="13" fill="#4c6660">Safety, refusal, timeout</text><text x="440" y="330" text-anchor="middle" font-size="14">Terminal reports retain outcomes. Invalid evidence or safety can interrupt the active sequence.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="dt dd"><title id="dt">In-flight target comparison</title><desc id="dd">Both policies correct a mid-edge sustained deviation; endpoint recovery is excluded.</desc><rect width="900" height="340" fill="#f7faf8" rx="14"/><g font-family="Arial, sans-serif"><text x="36" y="30" font-size="17" fill="#173d38">SAME QUALIFIED MID-EDGE DEVIATION · DIFFERENT RETURN TARGET</text><rect x="30" y="75" width="360" height="93" rx="13" fill="#fff0dc" stroke="#82a69a"/><text x="210.0" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">B2 baseline</text><text x="210.0" y="126" text-anchor="middle" font-size="13" fill="#4f6961">Return to edge origin A</text><rect x="510" y="75" width="360" height="93" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="690.0" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">VECR</text><text x="690.0" y="126" text-anchor="middle" font-size="13" fill="#4f6961">Return to earliest required gap</text><path d="M87 218H812" stroke="#8fb4a3" stroke-width="14"/><path d="M87 218H395" stroke="#2c927b" stroke-width="14"/><path d="M395 218H495" stroke="#db9952" stroke-width="14" stroke-dasharray="5 6"/><text x="84" y="257" font-size="15" fill="#173d38">A</text><text x="812" y="257" font-size="15" fill="#173d38">B</text><text x="450" y="203" text-anchor="middle" font-size="13" fill="#ad5d2b">Unverified interval</text><text x="450" y="306" text-anchor="middle" font-size="15" fill="#173d38">Historical N07–N09 only; both triggers occur BEFORE B</text></g></svg>
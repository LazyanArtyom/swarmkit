<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc"><title id="title">Arrival and survey fulfillment</title><desc id="desc">Conceptual distinctions, not experimental measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#57716d" stroke-width="1.4"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eeea" stroke-width=".6"/></pattern></defs><rect width="880" height="360" rx="16" fill="#f8faf7"/><rect width="880" height="360" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#183c36"><text x="32" y="34" font-size="14" letter-spacing="2">DISTINCT EVIDENCE · DISTINCT MEANINGS</text><rect x="32" y="65" width="168" height="100" rx="12" fill="#fff" stroke="#afc7bc"/><text x="116.0" y="96" text-anchor="middle" font-size="17" font-weight="600">Command ACK</text><text x="116" y="123" text-anchor="middle" font-size="12">The backend accepted a</text><text x="116" y="140" text-anchor="middle" font-size="12">request</text><rect x="248" y="65" width="168" height="100" rx="12" fill="#fff" stroke="#afc7bc"/><text x="332.0" y="96" text-anchor="middle" font-size="17" font-weight="600">Stopped arrival</text><text x="332" y="123" text-anchor="middle" font-size="12">Bounded pose</text><text x="332" y="140" text-anchor="middle" font-size="12">speed</text><text x="332" y="157" text-anchor="middle" font-size="12">dwell</text><rect x="464" y="65" width="168" height="100" rx="12" fill="#fff" stroke="#afc7bc"/><text x="548.0" y="96" text-anchor="middle" font-size="17" font-weight="600">Survey evidence</text><text x="548" y="123" text-anchor="middle" font-size="12">Accepted full-strip</text><text x="548" y="140" text-anchor="middle" font-size="12">intervals</text><rect x="680" y="65" width="168" height="100" rx="12" fill="#d7ece1" stroke="#afc7bc"/><text x="764.0" y="96" text-anchor="middle" font-size="17" font-weight="600">Fulfillment</text><text x="764" y="123" text-anchor="middle" font-size="12">The requested</text><text x="764" y="140" text-anchor="middle" font-size="12">predicates hold</text><text x="440" y="214" text-anchor="middle" font-size="16">ACK does not establish arrival. Arrival does not establish survey coverage.</text><path d="M74 290H806" stroke="#9aaea4" stroke-width="12"/><path d="M74 290H360 M510 290H806" stroke="#237966" stroke-width="12"/><path d="M360 290H510" stroke="#c47735" stroke-width="12" stroke-dasharray="4 6"/><text x="74" y="323" font-size="14">A</text><text x="805" y="323" font-size="14">B</text><text x="435" y="270" text-anchor="middle" font-size="13">Unverified interval remains</text></g></svg>
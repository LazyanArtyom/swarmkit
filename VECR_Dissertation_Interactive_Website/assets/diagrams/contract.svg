<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 335" role="img" aria-labelledby="t d"><title id="t">Four distinct edge execution facts</title><desc id="d">Command acceptance, physical arrival and accepted coverage are different facts. At B the agent reports two independent statuses, without a return command.</desc><rect width="880" height="335" rx="15" fill="#f8faf7"/><g font-family="Arial,sans-serif" fill="#183c36"><text x="30" y="36" font-size="18">DISTINGUISH OBSERVABLE FACTS</text><g font-size="17" text-anchor="middle"><rect x="27" y="64" width="252" height="84" rx="12" stroke="#a0c5b7" fill="#e7f0eb"/><text x="153" y="96" font-weight="bold">COMMAND ACK</text><text x="153" y="123" font-size="13">Backend accepted request</text><rect x="315" y="64" width="252" height="84" rx="12" stroke="#a0c5b7" fill="#e7f0eb"/><text x="441" y="96" font-weight="bold">STOPPED ARRIVAL</text><text x="441" y="123" font-size="13">Physical B dwell qualified</text><rect x="601" y="64" width="252" height="84" rx="12" stroke="#a0c5b7" fill="#e7f0eb"/><text x="727" y="96" font-weight="bold">SURVEY EVIDENCE</text><text x="727" y="123" font-size="13">Interval union independently verified</text></g><path d="M80 203H800" stroke="#b8c8c2" stroke-width="12"/><path d="M80 203H360M485 203H800" stroke="#24836e" stroke-width="12"/><path d="M360 203H485" stroke="#d1954d" stroke-width="12" stroke-dasharray="5 6"/><text x="74" y="231" font-size="14">A</text><text x="789" y="231" font-size="14">B</text><text x="422" y="181" text-anchor="middle" font-size="14">Unverified</text><rect x="123" y="268" width="635" height="48" rx="11" fill="#dfebe5" stroke="#24836e"/><text x="440" y="289" text-anchor="middle" font-weight="bold" font-size="16">TERMINAL: ARRIVED / INCOMPLETE</text><text x="440" y="308" text-anchor="middle" font-size="12">No automatic post-B return; caller chooses next action</text></g></svg>
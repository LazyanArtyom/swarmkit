<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="title desc"><title id="title">Independent evidence and truth paths</title><desc id="desc">Measurement estimation and oracle scoring are separate paths.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#57716d" stroke-width="1.4"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eeea" stroke-width=".6"/></pattern></defs><rect width="880" height="400" rx="16" fill="#f8faf7"/><rect width="880" height="400" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#183c36"><rect x="280" y="24" width="320" height="72" rx="12" fill="#f5e7d5" stroke="#afc7bc"/><text x="440.0" y="55" text-anchor="middle" font-size="17" font-weight="600">Private simulator state</text><text x="440.0" y="79" text-anchor="middle" font-size="13" fill="#4c6660">Actual 20 ms motion and acquisitions</text><path d="M330 96 L220 142" fill="none" stroke="#57716d" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M550 96 L660 142" fill="none" stroke="#57716d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="145" width="350" height="72" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="215.0" y="176" text-anchor="middle" font-size="17" font-weight="600">Noisy telemetry adapter</text><text x="215.0" y="200" text-anchor="middle" font-size="13" fill="#4c6660">Seeded bounds, bias and delay</text><rect x="490" y="145" width="350" height="72" rx="12" fill="#f5e7d5" stroke="#afc7bc"/><text x="665.0" y="176" text-anchor="middle" font-size="17" font-weight="600">Independent physical oracle</text><text x="665.0" y="200" text-anchor="middle" font-size="13" fill="#4c6660">Actual acquired rectangular footprints</text><path d="M215 217 L215 258" fill="none" stroke="#57716d" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M665 217 L665 258" fill="none" stroke="#57716d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="260" width="350" height="72" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="215.0" y="291" text-anchor="middle" font-size="17" font-weight="600">Camera estimator → agent</text><text x="215.0" y="315" text-anchor="middle" font-size="13" fill="#4c6660">Measured pose + fixed calibration</text><rect x="490" y="260" width="350" height="72" rx="12" fill="#f5e7d5" stroke="#afc7bc"/><text x="665.0" y="291" text-anchor="middle" font-size="17" font-weight="600">Python reconstruction</text><text x="665.0" y="315" text-anchor="middle" font-size="13" fill="#4c6660">Half-space geometry + trace checks</text><text x="440" y="376" text-anchor="middle" font-size="14">Hidden truth is never an input to the camera estimator or production verifier.</text></g></svg>
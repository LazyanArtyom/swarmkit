<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc"><title id="title">VECR recovery rule and conditional boundary</title><desc id="desc">Current q=min(p,g) departure and q=g endpoint rule, with bounded waiting, physical re-entry and no unconditional completion guarantee.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#57716d" stroke-width="1.4"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eeea" stroke-width=".6"/></pattern></defs><rect width="880" height="420" rx="16" fill="#f8faf7"/><rect width="880" height="420" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#183c36"><text x="32" y="34" font-size="14" letter-spacing="2">CANONICAL VECR · EVIDENCE-SELECTED LOCAL REPAIR</text><text x="32" y="74" font-size="18" font-weight="600">Accepted intervals persist; the earliest gap stays visible</text><path d="M70 113H810" stroke="#cbd9cf" stroke-width="14"/><path d="M70 113H360 M475 113H810" stroke="#237966" stroke-width="14"/><path d="M360 113H475" stroke="#c47735" stroke-width="14" stroke-dasharray="5 6"/><text x="70" y="145" font-size="13">A</text><text x="345" y="145" font-size="13">g · first missing coordinate</text><text x="802" y="145" font-size="13">B</text><rect x="30" y="178" width="390" height="92" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="225.0" y="209" text-anchor="middle" font-size="17" font-weight="600">Sustained corridor departure</text><text x="225.0" y="233" text-anchor="middle" font-size="13" fill="#4c6660">q = min(current progress p, earliest gap g)</text><rect x="460" y="178" width="390" height="92" rx="12" fill="#e3eee7" stroke="#afc7bc"/><text x="655.0" y="209" text-anchor="middle" font-size="17" font-weight="600">Qualified stopped endpoint</text><text x="655.0" y="233" text-anchor="middle" font-size="13" fill="#4c6660">wait ≤ 3 s for delivery; then q = g</text><text x="440" y="317" text-anchor="middle" font-size="16" font-weight="600">Command ACK ≠ re-entry · sampled stop and valid evidence decide progress</text><rect x="32" y="337" width="816" height="57" rx="10" fill="#fff1dd" stroke="#cda775"/><text x="440" y="359" text-anchor="middle" font-size="13">Safety invariant: unverified gaps cannot be credited by movement or command acceptance.</text><text x="440" y="380" text-anchor="middle" font-size="13">No unconditional completion: sensor, energy, command, repair budget and deadline may fail.</text></g></svg>
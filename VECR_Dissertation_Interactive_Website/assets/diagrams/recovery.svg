<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="dt dd"><title id="dt">Revised VECR decision boundary</title><desc id="dd">Only in-flight departure can trigger local recovery; terminal arrival reports gaps but issues no repair commands.</desc><rect width="900" height="350" fill="#f7faf8" rx="14"/><g font-family="Arial, sans-serif"><text x="36" y="31" font-size="17" fill="#1d4942">ONE AUTOMATIC CORRECTION TRIGGER · DURING A → B</text><rect x="30" y="55" width="255" height="81" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="157.5" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">MOVING</text><text x="157.5" y="106" text-anchor="middle" font-size="13" fill="#4f6961">Monitor corridor and evidence</text><rect x="320" y="55" width="255" height="81" rx="13" fill="#fff0dc" stroke="#82a69a"/><text x="447.5" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">DEVIATING</text><text x="447.5" y="106" text-anchor="middle" font-size="13" fill="#4f6961">Sustained, qualified departure</text><rect x="610" y="55" width="255" height="81" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="737.5" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">RECOVERING</text><text x="737.5" y="106" text-anchor="middle" font-size="13" fill="#4f6961">Bounded local re-entry</text><path d="M285 95H318 M575 95H608" stroke="#4e7e70" stroke-width="3"/><text x="450" y="169" text-anchor="middle" font-size="15" fill="#173d38">Target q = min(projected progress, first unverified required position)</text><rect x="30" y="197" width="385" height="80" rx="13" fill="#e4f1e9" stroke="#82a69a"/><text x="222.5" y="227" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">BEFORE B</text><text x="222.5" y="248" text-anchor="middle" font-size="13" fill="#4f6961">Verify re-entry → resume toward B</text><rect x="485" y="197" width="380" height="80" rx="13" fill="#eff0ff" stroke="#82a69a"/><text x="675.0" y="227" text-anchor="middle" font-size="17" font-weight="bold" fill="#173d38">AT B</text><text x="675.0" y="248" text-anchor="middle" font-size="13" fill="#4f6961">Emit ARRIVED + coverage report only</text><text x="450" y="317" text-anchor="middle" font-size="16" font-weight="bold" fill="#a35424">NO post-arrival GOTO · finite budget or explicit FAILED outcome</text></g></svg>